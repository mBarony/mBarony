name: Metrics

on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT clássico com escopo `repo` (inclui commits/contribuições privadas)
          token: ${{ secrets.METRICS_TOKEN }}
          user: mBarony
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
